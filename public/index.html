<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Markets</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="topbar">
        <h1>F1 Prediction Markets</h1>
        <div id="session"></div>
      </header>

      <section class="card auth-card" id="authCard">
        <h2>Login / Register</h2>
        <div class="row">
          <input id="username" placeholder="username" />
          <input id="password" placeholder="password (min 8)" type="password" />
          <button id="loginBtn">Login</button>
          <button id="registerBtn" class="secondary">Register</button>
        </div>
        <small>Default admin: <code>admin</code> / <code>Admin123!</code> (change via env vars).</small>
      </section>

      <section class="card" id="adminPanel" style="display:none">
        <h2>Admin Panel</h2>
        <div class="grid-two">
          <div>
            <h3>Create Market</h3>
            <input id="mTitle" placeholder="Race question (e.g. Who wins Monaco GP?)" />
            <textarea id="mDesc" placeholder="Description"></textarea>
            <textarea id="mOptions" placeholder='Options JSON, e.g. [{"name":"Max","price":65},{"name":"Lando","price":22}]'></textarea>
            <button id="createMarketBtn">Create Market</button>
          </div>
          <div>
            <h3>Settle Market</h3>
            <input id="resolveMarketId" placeholder="Market ID" />
            <input id="winningOption" placeholder="Winning option text" />
            <button id="resolveBtn">Resolve + Pay Out</button>

            <h3>Adjust User Balance</h3>
            <input id="adjUser" placeholder="Username" />
            <input id="adjDelta" placeholder="Amount delta (+/-)" />
            <button id="adjustBtn">Update Balance</button>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Markets</h2>
        <div id="markets" class="markets"></div>
      </section>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
